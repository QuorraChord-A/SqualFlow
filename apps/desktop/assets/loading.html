<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SquadFlow</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #f9f5ec;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    main {
      width: min(240px, calc(100vw - 48px));
      aspect-ratio: 1;
    }
    .icon-shell {
      width: 100%;
      height: 100%;
      animation: breathe 2.8s ease-in-out infinite;
    }
    .app-icon {
      display: block;
      width: 100%;
      height: 100%;
    }
    .stroke {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }
    .inner-stroke {
      stroke: url(#inner-texture);
      stroke-width: 64;
      animation: draw-stroke 1100ms ease-in-out forwards;
    }
    .outer-stroke {
      stroke: url(#outer-texture);
      stroke-width: 76;
      animation: draw-stroke 1500ms 1100ms ease-in-out forwards;
    }
    .accent-stroke {
      stroke: url(#accent-texture);
      stroke-width: 54;
      animation: draw-stroke 500ms 2600ms ease-in-out forwards;
    }
    @keyframes draw-stroke { to { stroke-dashoffset: 0; } }
    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.015); }
    }
    @media (prefers-reduced-motion: reduce) {
      .icon-shell { animation: none; }
      .stroke { stroke-dashoffset: 0; animation: none; }
    }
  </style>
</head>
<body>
  <main aria-label="正在启动 SquadFlow">
    <div class="icon-shell" aria-hidden="true">
      <svg class="app-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="outer-texture" patternUnits="userSpaceOnUse" width="512" height="512">
            <image width="512" height="512" href="icon-loading-outer.png"/>
          </pattern>
          <pattern id="inner-texture" patternUnits="userSpaceOnUse" width="512" height="512">
            <image width="512" height="512" href="icon-loading-inner.png"/>
          </pattern>
          <pattern id="accent-texture" patternUnits="userSpaceOnUse" width="512" height="512">
            <image width="512" height="512" href="icon-loading-accent.png"/>
          </pattern>
        </defs>
        <g class="drawn-strokes">
          <path class="stroke outer-stroke" pathLength="1" d="M407 286C417 240 416 183 383 142C350 101 304 90 251 90H187C131 90 96 126 96 184V315C96 383 139 427 207 427H310"/>
          <path class="stroke inner-stroke" pathLength="1" d="M270 295C301 288 318 263 318 226C318 198 296 190 261 190H236C197 190 182 214 182 251V285C182 334 205 378 246 378H342"/>
          <path class="stroke accent-stroke" pathLength="1" d="M417 344C411 391 377 424 327 439"/>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
