name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/local-service/package-lock.json
            apps/renderer/package-lock.json
            apps/desktop/package-lock.json
      - run: npm run setup
      - run: npm run check
      - run: npm run build
